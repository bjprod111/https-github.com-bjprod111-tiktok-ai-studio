<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pulse Studio — Mobile AI Creator Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-nav { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(16px); border-color: rgba(255, 255, 255, 0.08); }
    .accent-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
    .accent-text { background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-active { color: #818cf8; position: relative; }
    .nav-active::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #818cf8; border-radius: 50%; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20 select-none">

  <!-- Header -->
  <header class="glass-nav sticky top-0 z-40 px-4 py-3 flex items-center justify-between border-b">
    <div class="flex items-center space-x-2">
      <button id="btnBack" class="hidden p-2 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-200 transition-colors">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <button id="btnHome" class="p-2 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-200 transition-colors">
        <i class="fa-solid fa-house text-sm"></i>
      </button>
      <div class="flex items-center space-x-2 ml-1">
        <div class="w-7 h-7 rounded-lg accent-gradient flex items-center justify-center font-bold text-white text-xs shadow-md shadow-indigo-500/20">P</div>
        <span class="font-bold text-base tracking-tight">Pulse<span class="accent-text">Studio</span></span>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="navTo('account')" class="p-2 rounded-xl bg-gray-800/80 hover:bg-gray-700 text-gray-200 transition-colors relative">
        <i class="fa-solid fa-user text-sm"></i>
        <span id="apiKeyStatusDot" class="absolute top-1 right-1 w-2 h-2 rounded-full bg-amber-500"></span>
      </button>
    </div>
  </header>

  <!-- Main View -->
  <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col gap-5">
    <!-- STUDIO VIEW -->
    <section id="view-studio" class="app-view flex flex-col gap-5">
      <div id="keyWarningBanner" class="hidden glass-card rounded-2xl p-3 border-amber-500/30 bg-amber-500/10 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <i class="fa-solid fa-key text-amber-400 text-sm"></i>
          <span class="text-xs text-amber-200">Gemini API Key required to run AI.</span>
        </div>
        <button onclick="navTo('account')" class="text-xs bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 font-semibold px-2.5 py-1 rounded-lg border border-amber-500/30">Setup</button>
      </div>

      <div class="glass-card rounded-2xl p-5 shadow-xl">
        <div class="flex justify-between items-start mb-3">
          <div>
            <h2 class="text-lg font-bold">AI Content Studio</h2>
            <p class="text-xs text-gray-400">Generate viral scripts, captions & hashtag strategies.</p>
          </div>
          <span id="activeModelBadge" class="text-[10px] uppercase font-bold tracking-wider bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30">Auto-Detecting</span>
        </div>
        
        <form id="studioForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Niche / Topic</label>
            <input type="text" id="topicInput" required placeholder="e.g. Minimalist Tech Setup" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Target Audience</label>
            <input type="text" id="audienceInput" placeholder="e.g. Gen-Z Creators" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">Tone & Vibe</label>
            <select id="toneSelect" class="w-full bg-gray-900/90 border border-gray-700/80 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="Energetic & Fast-Paced">Energetic & Fast-Paced</option>
              <option value="Educational & Direct">Educational & Direct</option>
              <option value="Cinematic & Storytelling">Cinematic & Storytelling</option>
              <option value="Humorous & Relatable">Humorous & Relatable</option>
            </select>
          </div>
          <button type="submit" id="generateBtn" class="w-full py-3 rounded-xl accent-gradient font-semibold text-sm shadow-lg shadow-indigo-500/25 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Generate Content Bundle</span>
          </button>
        </form>
      </div>

      <div id="resultsContainer" class="hidden flex-col gap-4">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-xs tracking-wider text-gray-400 uppercase">Output Deliverables</h3>
          <div class="flex gap-2">
            <button id="btnSaveProject" class="text-xs bg-indigo-600/30 text-indigo-200 px-3 py-1 rounded-lg border border-indigo-500/30 flex items-center space-x-1"><i class="fa-solid fa-bookmark text-[10px]"></i><span>Save</span></button>
            <button id="btnPostToFeed" class="text-xs bg-purple-600/30 text-purple-200 px-3 py-1 rounded-lg border border-purple-500/30 flex items-center space-x-1"><i class="fa-solid fa-share-nodes text-[10px]"></i><span>Share</span></button>
          </div>
        </div>
        <div class="glass-card rounded-2xl p-4">
          <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider block mb-2"><i class="fa-solid fa-video mr-1"></i> Script</span>
          <div id="scriptOutput" class="text-xs leading-relaxed text-gray-300 whitespace-pre-line font-mono bg-gray-900/60 p-3 rounded-xl border border-gray-800"></div>
        </div>
        <div class="glass-card rounded-2xl p-4">
          <span class="text-xs font-bold text-purple-400 uppercase tracking-wider block mb-2"><i class="fa-solid fa-quote-left mr-1"></i> Caption & Tags</span>
          <div id="captionOutput" class="text-xs leading-relaxed text-gray-300 whitespace-pre-line bg-gray-900/60 p-3 rounded-xl border border-gray-800"></div>
        </div>
      </div>
    </section>

    <!-- PROJECTS VIEW -->
    <section id="view-projects" class="app-view hidden flex-col gap-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">Saved Projects</h2>
        <span id="projectCount" class="text-xs bg-gray-800 px-2.5 py-1 rounded-full text-gray-300 font-semibold border border-gray-700">0 items</span>
      </div>
      <div id="projectsList" class="flex flex-col gap-3"></div>
    </section>

    <!-- COMMUNITY FEED VIEW -->
    <section id="view-community" class="app-view hidden flex-col gap-4">
      <h2 class="text-lg font-bold">Community Feed</h2>
      <div id="communityFeedList" class="flex flex-col gap-4"></div>
    </section>

    <!-- ACCOUNT VIEW -->
    <section id="view-account" class="app-view hidden flex-col gap-5">
      <h2 class="text-lg font-bold">Account & Settings</h2>
      <div class="glass-card rounded-2xl p-5 border-indigo-500/20">
        <h3 class="text-sm font-bold mb-1 flex items-center text-indigo-300"><i class="fa-solid fa-key mr-2 text-xs"></i> Gemini API Key</h3>
        <p class="text-xs text-gray-400 mb-3">Enter your Google AI Studio API Key:</p>
        <input type="password" id="accountApiKeyInput" placeholder="AIzaSy..." class="w-full bg-gray-900 border border-gray-700/80 rounded-xl px-3 py-2.5 text-sm text-white mb-3 focus:outline-none focus:border-indigo-500">
        <button id="btnSaveAccountKey" class="w-full py-2.5 accent-gradient rounded-xl font-semibold text-xs shadow-md shadow-indigo-500/20">Save Key</button>
      </div>
    </section>
  </main>

  <!-- Bottom Nav -->
  <nav class="glass-nav fixed bottom-0 left-0 right-0 z-40 border-t border-gray-800 px-6 py-2">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <button onclick="navTo('studio')" id="tab-studio" class="nav-btn nav-active flex flex-col items-center gap-1 text-gray-400 hover:text-white"><i class="fa-solid fa-wand-magic-sparkles text-lg"></i><span class="text-[10px] font-semibold">Studio</span></button>
      <button onclick="navTo('projects')" id="tab-projects" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white"><i class="fa-solid fa-folder-open text-lg"></i><span class="text-[10px] font-semibold">Projects</span></button>
      <button onclick="navTo('community')" id="tab-community" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white"><i class="fa-solid fa-compass text-lg"></i><span class="text-[10px] font-semibold">Feed</span></button>
      <button onclick="navTo('account')" id="tab-account" class="nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white"><i class="fa-solid fa-sliders text-lg"></i><span class="text-[10px] font-semibold">Settings</span></button>
    </div>
  </nav>

  <script src="app.js?v=20260823004310"></script>
</body>
</html>
